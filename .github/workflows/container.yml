name: Publish production container
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require browser build configuration
        env:
          BROWSER_AK: ${{ secrets.VITE_BAIDU_BROWSER_AK }}
        run: test -n "$BROWSER_AK"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test, build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kaedehararaven/city-pause:sha-${{ github.sha }}
            ghcr.io/kaedehararaven/city-pause:latest
          labels: |
            org.opencontainers.image.source=https://github.com/kaedehararaven/city-pause
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            browser_ak=${{ secrets.VITE_BAIDU_BROWSER_AK }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
